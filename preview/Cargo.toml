[package]
name = "dns-provider-preview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
dns-provider = { path = ".." }
axum = "0.8"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net"] }
topcoat = { version = "0.11", default-features = false, features = ["view", "icon-iconify"] }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
topcoat = { version = "0.11", default-features = false, features = ["tailwind", "icon-iconify"] }
