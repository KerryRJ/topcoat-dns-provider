[package]
name = "dns-provider"
version = "0.1.0"
edition = "2024"
description = "Asynchronous DNS provider interface"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
dns-update = "0.6"
topcoat = { version = "0.11", default-features = false, features = ["ui", "view", "icon-iconify", "tailwind", "font-fontsource", "asset"] }

[build-dependencies]
topcoat = { version = "0.11", default-features = false, features = ["icon-iconify"] }



[dev-dependencies]
serde_json = "1.0"
